name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # The function-hooks API is early access and moves between releases:
      # raise this on purpose, together with any API changes it needs.
      CLAUDE_CODE_VERSION: 2.1.287
    steps:
      - uses: actions/checkout@v7
        with:
          # The version check compares with the base branch.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Test the CI scripts
        run: node --test ".github/scripts/*.test.mjs"
      - name: Version and changelog follow the release rules
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node .github/scripts/check-version.mjs "origin/${BASE_REF}"
      - name: Install Claude Code
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
      - name: Validate manifest, marketplace and hooks
        run: |
          claude plugin validate .
          claude plugin validate plugin
      - name: Test
        run: node scripts/test.mjs
